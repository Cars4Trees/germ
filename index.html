<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#10b981" />
    <meta name="background-color" content="#0f172a" />
    <meta name="display" content="standalone" />
    <meta name="orientation" content="portrait" />
    
    <!-- App Meta Tags -->
    <meta name="description" content="Turn junk cars into urban forests. Cars for Trees helps fund reforestation through circular economy principles." />
    <meta name="keywords" content="cars, trees, environment, sustainability, circular economy, urban forest, reforestation" />
    <meta name="author" content="Cars for Trees" />
    
    <!-- Open Graph Tags -->
    <meta property="og:title" content="Cars for Trees - Turn Junk into Urban Forests" />
    <meta property="og:description" content="Submit photos of junk cars to help fund urban reforestation projects" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cars for Trees" />
    
    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cars for Trees" />
    <meta name="twitter:description" content="Turn junk cars into urban forests" />
    
    <!-- Apple PWA Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cars4Trees" />
    
    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <title>Cars for Trees - Turn Junk into Urban Forests</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered: ', registration);
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
</html>
